name: Refactor shared lecture interactions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lecture-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply lecture refactor
        run: python .lecture_refactor.py
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Refactor shared lecture interactions"
            git push origin main
          fi
