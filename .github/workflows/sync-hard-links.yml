name: Sync hard practice links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-hard-links.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync links
        run: python .sync_hard_links.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sorting-problems.html sorting-problems-ru.html sorting-applications-ru.html
          git commit -m "Link bilingual hard practice pages"
          git push origin main
# retry after correcting exact source text
