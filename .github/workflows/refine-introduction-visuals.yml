name: Refine introduction visuals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-introduction-visuals.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refine introduction visuals
        run: python .intro_visual_refine.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Refine introduction visuals and growth explorer"
            git push origin main
          fi
