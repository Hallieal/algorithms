name: Integrate introduction chapter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-introduction.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Integrate introduction chapter
        run: python .intro_integration.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Integrate Introduction to Algorithms chapter"
            git push origin main
          fi
