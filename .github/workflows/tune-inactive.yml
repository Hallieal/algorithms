name: Tune inactive topic styling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tune-inactive.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update styling
        run: python .tune_inactive.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Lighten inactive topic icons"
          git push origin main
