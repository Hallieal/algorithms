name: Apply site review fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-review-fixes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply review fixes
        run: python .site_review_fixes.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Apply remaining sorting site review fixes"
            git push origin main
          fi
