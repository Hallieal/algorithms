name: Translate practice problems

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/translate-practice.yml'

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Build Russian practice pages
        run: python .translate_problems_payload.py
      - name: Commit translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add Russian practice problem pages"
            git push origin main
          fi
