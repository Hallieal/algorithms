name: Refactor lecture interactions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lecture-core-refactor.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refactor lecture interactions
        run: python .lecture_core_refactor.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Share lecture interaction infrastructure"
            git push origin main
          fi
