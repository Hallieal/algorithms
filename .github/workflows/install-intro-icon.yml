name: Install final Introduction icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-intro-icon.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild image asset and update homepages
        run: |
          set -euo pipefail
          cat .tmp-intro-icon-0.b64 .tmp-intro-icon-1.b64 .tmp-intro-icon-2.b64 .tmp-intro-icon-3.b64 | base64 -d > assets/images/topic-introduction.webp
          file assets/images/topic-introduction.webp
          python - <<'PY'
          from pathlib import Path
          for name in ('index.html','index-ru.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace('assets/images/topic-introduction.png?v=1','assets/images/topic-introduction.webp?v=2')
              s=s.replace('assets/images/topic-introduction.png','assets/images/topic-introduction.webp?v=2')
              p.write_text(s,encoding='utf-8')
          old=Path('assets/images/topic-introduction.png')
          if old.exists(): old.unlink()
          for i in range(4):
              Path(f'.tmp-intro-icon-{i}.b64').unlink(missing_ok=True)
          Path('.github/workflows/install-intro-icon.yml').unlink(missing_ok=True)
          PY
          grep -q 'topic-introduction.webp?v=2' index.html
          grep -q 'topic-introduction.webp?v=2' index-ru.html
      - name: Commit final icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use final Introduction section icon"
          git push origin main
