name: Integrate Data Structures chapter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-data-structures.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply integration
        run: python .integrate_data_structures.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Data Structures into chapter sequence"
          git push origin main
