name: Tighten Closest Pair proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tighten-closest-pair.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update Closest Pair
        run: python .tighten_closest_pair.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add problem-closest-pair.html problem-closest-pair-ru.html
          git commit -m "Tighten Closest Pair packing proof"
          git push origin main
