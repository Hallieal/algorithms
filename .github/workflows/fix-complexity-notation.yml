name: Fix complexity notation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-complexity-notation.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace incorrect complexity notation
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('sorting-merge.html'),
              Path('sorting-merge-ru.html'),
              Path('sorting-quick.html'),
              Path('sorting-quick-ru.html'),
          ]

          old = 'Θ(loglinear)'
          new = 'Θ(n log n)'

          for path in files:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count:
                  path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: {count} replacement(s)')
          PY
      - name: Commit corrected pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sorting-merge.html sorting-merge-ru.html sorting-quick.html sorting-quick-ru.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix sorting complexity notation"
            git push origin main
          fi
