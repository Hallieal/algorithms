name: Navigation audit and controls

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/navigation-audit.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply navigation improvements and audit links
        run: python .navigation_audit.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Improve navigation and interactive controls"
            git push origin main
          fi
